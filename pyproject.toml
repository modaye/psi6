[project]
name = "psi6"
version = "0.5.0"
description = "Agent-first PySide6 desktop framework: runtime, tasks, Python themes, and window chrome."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "modaye", email = "flywacool@gmail.com" },
]
requires-python = ">=3.13"
keywords = [
    "pyside6",
    "qt",
    "desktop",
    "gui",
    "theme",
    "tray",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "pydantic>=2.11",
    "pyside6>=6.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4",
    "loguru>=0.7",
    "mypy>=1.13",
    "ruff>=0.16",
]

[project.urls]
Homepage = "https://github.com/modaye/psi6"
Repository = "https://github.com/modaye/psi6"
Issues = "https://github.com/modaye/psi6/issues"
Changelog = "https://github.com/modaye/psi6/releases"

[project.scripts]
psi6 = "psi6.__main__:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
files = ["src/psi6"]
check_untyped_defs = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",  # 中文标点在注释和文案里是正常写法
    "RUF002",
    "RUF003",
    "RUF022",  # __all__ 按主题分组，不按字母排序
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.coverage.run]
source = ["src/psi6"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
