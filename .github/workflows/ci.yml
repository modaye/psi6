name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov=psi6
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and smoke-test wheel
        shell: bash
        run: |
          uv build
          WHEEL=$(ls dist/psi6-*.whl | head -1)
          uv run --isolated --no-project --with "$WHEEL" python -c "import psi6, psi6.ui; from psi6 import Tokens; assert Tokens.light().color_bg == '#ffffff'"
