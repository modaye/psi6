name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check src tests
      - name: Type check
        run: |
          uv run mypy --platform win32
          uv run mypy --platform linux
          uv run mypy --platform darwin
      - name: Test
        run: uv run pytest --cov=psi6
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and smoke-test distributions
        shell: bash
        run: |
          uv build
          python scripts/check_dist.py
          WHEEL=$(ls dist/psi6-*.whl | head -1)
          SDIST=$(ls dist/psi6-*.tar.gz | head -1)
          uv run --isolated --no-project --with "$WHEEL" python -c "import psi6, sys; assert 'psi6.ui' not in sys.modules; from psi6 import App, Tokens; assert Tokens.light().color_bg == '#faf9f7'"
          uv run --isolated --no-project --with "$WHEEL" python -c "from psi6.ui import DataTable; from psi6 import App; assert DataTable and App"
          uv run --isolated --no-project --with "$WHEEL" python -m psi6 catalog --json >/tmp/psi6-catalog.json
          uv run --isolated --no-project --with "$WHEEL" python -m psi6 theme light --check
          uv run --isolated --no-project --with "$SDIST" python -c "import psi6, sys; assert 'psi6.ui' not in sys.modules; from psi6 import App"
        env:
          QT_QPA_PLATFORM: offscreen

  test-py314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install
        run: uv sync --extra dev --python 3.14
      - name: Type check and test
        run: |
          uv run --python 3.14 mypy --platform linux
          uv run --python 3.14 pytest
        env:
          QT_QPA_PLATFORM: offscreen
