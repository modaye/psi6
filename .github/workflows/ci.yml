name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install and test
        run: |
          uv sync --extra dev
          uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
